<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Bizzie</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple: #4B3FA0; --purple-dark: #32296B; --purple-light: #EEEDFE;
    --purple-mid: #7F77DD; --white: #ffffff; --offwhite: #F9F8FC;
    --text: #1a1a2e; --text-muted: #6b6882; --border: #e4e2f0;
    --green: #0F6E56; --red: #A32D2D; --red-light: #FDECEA;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--offwhite); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  nav { background: white; border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--purple-dark); text-decoration: none; }
  .logo span { color: var(--purple-mid); }
  .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: white; border: 1.5px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; }
  .card-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--text); margin-bottom: 0.4rem; }
  .card-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
  .tabs { display: flex; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 2rem; }
  .tab { flex: 1; padding: 0.6rem; text-align: center; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; color: var(--text-muted); background: white; border: none; font-family: 'DM Sans', sans-serif; }
  .tab.active { background: var(--purple); color: white; }
  .form-group { margin-bottom: 1.25rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
  input { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--text); outline: none; transition: border-color 0.2s; }
  input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(75,63,160,0.08); }
  .btn { width: 100%; padding: 0.875rem; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; margin-top: 0.5rem; }
  .btn-primary { background: var(--purple); color: white; }
  .btn-primary:hover { background: var(--purple-dark); }
  .btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
  .divider { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 1.25rem 0; position: relative; }
  .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); }
  .divider span { background: white; padding: 0 0.75rem; position: relative; }
  .link-row { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 1.25rem; }
  .link-row a { color: var(--purple); text-decoration: none; font-weight: 600; }
  .alert { padding: 0.875rem 1rem; border-radius: 10px; font-size: 0.875rem; margin-bottom: 1rem; }
  .alert-error { background: var(--red-light); color: var(--red); border: 1px solid #F5C6C6; }
  .alert-success { background: #E1F5EE; color: var(--green); border: 1px solid #B3E5D5; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.4rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Bizzie<span>.</span></a>
</nav>
<div class="page">
  <div class="card">
    <h1 class="card-title">Welcome to Bizzie</h1>
    <p class="card-sub">Sign in to manage your listings and enquiries</p>

    <div class="tabs">
      <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
    </div>

    <div id="alert-box" class="hidden"></div>

    <!-- SIGN IN -->
    <div id="form-signin">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="signin-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')signIn()">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signin-password" placeholder="Your password" onkeydown="if(event.key==='Enter')signIn()">
      </div>
      <button class="btn btn-primary" id="btn-signin" onclick="signIn()">Sign in</button>
      <div class="link-row"><a href="#" onclick="showForgot()">Forgot your password?</a></div>
    </div>

    <!-- SIGN UP -->
    <div id="form-signup" class="hidden">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="signup-name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="signup-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Phone number <span style="font-weight:400;color:var(--text-muted);font-size:0.8rem;">optional</span></label>
        <input type="tel" id="signup-phone" placeholder="+61 4xx xxx xxx">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="At least 8 characters">
      </div>
      <button class="btn btn-primary" id="btn-signup" onclick="signUp()">Create account</button>
      <div class="link-row" style="margin-top:1rem;font-size:0.78rem;">By creating an account you agree to our <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a></div>
    </div>

    <!-- FORGOT PASSWORD -->
    <div id="form-forgot" class="hidden">
      <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1.25rem;">Enter your email and we will send you a reset link.</p>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="forgot-email" placeholder="your@email.com">
      </div>
      <button class="btn btn-primary" onclick="resetPassword()">Send reset link</button>
      <div class="link-row"><a href="#" onclick="switchTab('signin')">Back to sign in</a></div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = 'https://xxtzurdzahjbsutfeatj.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4dHp1cmR6YWhqYnN1dGZlYXRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDY3NjksImV4cCI6MjA5NTcyMjc2OX0.pJ5mSC4GviEkrlexi85MmIsT6kYV2k03FtLzERHDGgY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Redirect if already logged in
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'bizzie-dashboard.html';
  });

  function switchTab(tab) {
    document.getElementById('form-signin').classList.toggle('hidden', tab !== 'signin');
    document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');
    document.getElementById('form-forgot').classList.toggle('hidden', true);
    document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    clearAlert();
  }

  function showForgot() {
    document.getElementById('form-signin').classList.add('hidden');
    document.getElementById('form-forgot').classList.remove('hidden');
    clearAlert();
  }

  function showAlert(msg, type) {
    const box = document.getElementById('alert-box');
    box.className = 'alert alert-' + type;
    box.textContent = msg;
    box.classList.remove('hidden');
  }

  function clearAlert() {
    document.getElementById('alert-box').classList.add('hidden');
  }

  function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner"></span>Please wait...' : label;
  }

  async function signIn() {
    const email = document.getElementById('signin-email').value.trim();
    const password = document.getElementById('signin-password').value;
    if (!email || !password) return showAlert('Please enter your email and password.', 'error');
    setLoading('btn-signin', true, 'Sign in');
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { showAlert(error.message, 'error'); setLoading('btn-signin', false, 'Sign in'); }
    else window.location.href = 'bizzie-dashboard.html';
  }

  async function signUp() {
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const phone = document.getElementById('signup-phone').value.trim();
    const password = document.getElementById('signup-password').value;
    if (!name || !email || !password) return showAlert('Please fill in all required fields.', 'error');
    if (password.length < 8) return showAlert('Password must be at least 8 characters.', 'error');
    setLoading('btn-signup', true, 'Create account');
    const { error } = await supabase.auth.signUp({
      email, password,
      options: { data: { full_name: name, phone } }
    });
    if (error) { showAlert(error.message, 'error'); setLoading('btn-signup', false, 'Create account'); }
    else showAlert('Account created! Check your email to confirm your address, then sign in.', 'success');
  }

  async function resetPassword() {
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) return showAlert('Please enter your email address.', 'error');
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/bizzie-auth.html'
    });
    if (error) showAlert(error.message, 'error');
    else showAlert('Reset link sent. Check your inbox.', 'success');
  }
</script>
</body>
</html>
